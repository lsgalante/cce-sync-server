[package]
name = "cce-sync-server"
version = "0.1.0"
edition = "2021"
description = "cce-sync on Cloudflare: the Worker, the vault Durable Object (SQLite) and R2 blobs"

# A cdylib for worker-build (the Worker), and an rlib so `cargo test` runs
# the portable half natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned by rev on GitHub so a standalone clone builds; the workspace root's
# [patch] redirects it to ../cce-sync. Repin with ../bump-revs.sh after
# pushing cce-sync. default-features = false: the CLI's deps don't build
# for wasm32. `xlsx`: the workbook tools, on IronCalc (patched below).
cce-sync = { git = "https://github.com/lsgalante/cce-sync.git", rev = "86214e2f689ade8d912d07008a6ecd8741be571b", default-features = false, features = ["mcp", "xlsx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
# The Google refresh token, sealed at rest (`seal`).
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"
async-lock = "3"
# Tokens, codes and nonces: crypto.getRandomValues through the "js" backend.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# IronCalc with zip's C codecs (bzip2, zstd) off, so it builds for wasm32:
# see vendor/ironcalc/VENDORED.md.
[patch.crates-io]
ironcalc = { path = "vendor/ironcalc" }
